# Copy this file to "config.ini" and edit it. Full documentation: README.md
#
# Rules: lines starting with # or ; are comments (own line only, never behind
# a value); no quotes around paths; Windows backslashes are NOT doubled.
# Relative paths are resolved from the folder you run the scripts from.

[folders]
# Reference folder (originals). Not touched by default.
folder_base = /path/to/folder_base
# Folder searched for duplicates. Matches found here are what gets moved away.
# The two folders must be separate: not identical, not nested in each other.
folder_copy = /path/to/folder_copy
# Folders to skip in BOTH scanned folders, one entry per line.
# IMPORTANT: the entry lines must be indented (start with spaces).
# An entry is a plain folder name (skipped at any depth, e.g. @eaDir) or an
# ABSOLUTE path (e.g. D:\Photos\Archive\Private). Everything below a skipped
# folder is skipped too. Remove the "#" in front of an example to use it.
exclude_folders =
    # @eaDir
    # .thumbnails
    # D:\Photos\Archive\Private

[options]
# CSV written by find_matches.py and read by delete_matches.py
output = matches.csv
# Also write a CSV with every scanned file that was NOT selected for deletion
export_not_selected = true
# Name (or path) of that CSV
not_selected_output = not_selected.csv
# Whose unselected files go into that CSV: folder_copy (default) or both
# (both = also the files of folder_base, which can make the CSV much larger)
not_selected_scope = folder_copy
# Whose copy is listed in the CSV (= what delete_matches.py acts on).
# CAUTION: folder_base would move your ORIGINALS instead of the copies.
record = folder_copy
# name_and_checksum | checksum (checksum ignores filenames and empty files)
match_by = name_and_checksum
# Treat Photo.JPG and photo.jpg as the same name (name_and_checksum only);
# also used when comparing excluded folder names
case_insensitive_names = true
# Compare all file types, not just images
all_files = false

[delete]
# Matched files are moved here. Must be OUTSIDE both scanned folders.
quarantine_folder = quarantine
# Every real action is appended to this CSV (local time)
log_file = deleted_log.csv
# Remove sub-folders that became empty after moving files
remove_empty_folders = true
# true = delete for good (no undo) instead of moving to quarantine
permanent_delete = false
